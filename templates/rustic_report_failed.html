<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="760" bgcolor="#f4f6f8" style=" width:760px; max-width:760px; box-sizing:border-box; border:1px solid #d5dbe1; border-collapse:separate; border-spacing:0; font-family:Arial,Helvetica,sans-serif; background:#f4f6f8; background-color:#f4f6f8; color:#263238; border-radius:12px; overflow:hidden; box-shadow:0 3px 15px rgba(0,0,0,.10) " >
<tr
    bgcolor="#172b4d"
    style="
        background:#172b4d;
        background-color:#172b4d
    "
>

    <td
        colspan="2"
        bgcolor="#172b4d"
        style="
            padding:0;
            background:#172b4d;
            background-color:#172b4d;
            border:0
        "
    >

        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            bgcolor="#172b4d"
            style="
                width:100%;
                border:0;
                border-collapse:collapse;
                border-spacing:0;
                background:#172b4d;
                background-color:#172b4d
            "
        >

            <tr
                bgcolor="#172b4d"
                style="
                    background:#172b4d;
                    background-color:#172b4d
                "
            >

                <td
                    width="65%"
                    bgcolor="#172b4d"
                    style="
                        width:65%;
                        padding:28px 32px;
                        background:#172b4d;
                        background-color:#172b4d;
                        border:0;
                        color:white
                    "
                >

                    <div
                        style="
                            font-size:13px;
                            letter-spacing:1.5px;
                            color:#a9bdd8;
                            text-transform:uppercase
                        "
                    >
                        Rustic Backup
                    </div>

                    <div
                        style="
                            font-size:27px;
                            font-weight:600;
                            margin-top:5px
                        "
                    >
                        {{ hostname }}
                    </div>

                    <div
                        style="
                            font-size:13px;
                            color:#b9c9dc;
                            margin-top:6px
                        "
                    >
                        {{ report_date }}
                    </div>

                </td>

                <td
                    width="35%"
                    bgcolor="#172b4d"
                    style="
                        width:35%;
                        padding:28px 32px;
                        background:#172b4d;
                        background-color:#172b4d;
                        border:0;
                        text-align:right;
                        vertical-align:middle
                    "
                >

                    <div
                        style="
                            display:inline-block;
                            background:#d64545;
                            background-color:#d64545;
                            color:white;
                            border-radius:20px;
                            padding:9px 17px;
                            font-size:13px;
                            font-weight:bold
                        "
                    >
                        ✕ FAILED
                    </div>

                </td>

            </tr>

        </table>

    </td>

</tr>


<tr>

    <td
        colspan="2"
        bgcolor="#ffffff"
        style="
            padding:26px 32px 12px;
            background:#ffffff;
            background-color:#ffffff;
            border:0
        "
    >

        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
                width:100%;
                border:0;
                border-collapse:collapse;
                border-spacing:0
            "
        >

            <tr>

                <td
                    bgcolor="#fff1f1"
                    style="
                        padding:16px 18px;
                        background:#fff1f1;
                        background-color:#fff1f1;
                        border-top:0;
                        border-right:0;
                        border-bottom:0;
                        border-left:4px solid #d64545;
                        border-radius:4px
                    "
                >

                    <div
                        style="
                            font-size:15px;
                            font-weight:bold;
                            color:#b52e2e
                        "
                    >
                        Backup failed
                    </div>

                    <div
                        style="
                            font-size:13px;
                            color:#6d7378;
                            margin-top:5px
                        "
                    >
                        Rustic reported an error. See the details below.
                    </div>

                </td>

            </tr>

        </table>

    </td>

</tr>


<tr>

    <td
        colspan="2"
        bgcolor="#ffffff"
        style="
            padding:14px 32px 12px;
            background:#ffffff;
            background-color:#ffffff;
            border:0
        "
    >

        <div
            style="
                font-size:12px;
                color:#7a8793;
                font-weight:bold;
                letter-spacing:1px
            "
        >
            ERROR
        </div>

    </td>

</tr>


<tr>

    <td
        colspan="2"
        bgcolor="#ffffff"
        style="
            padding:0 32px 28px;
            background:#ffffff;
            background-color:#ffffff;
            border:0
        "
    >

        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
                width:100%;
                border:0;
                border-collapse:collapse;
                border-spacing:0
            "
        >

            <tr>

                <td
                    bgcolor="#292d32"
                    style="
                        padding:16px;
                        background:#292d32;
                        background-color:#292d32;
                        border:0;
                        border-radius:6px
                    "
                >

                    <pre
                        style="
                            margin:0;
                            padding:0;
                            background:#292d32;
                            background-color:#292d32;
                            color:#f3f3f3;
                            font-family:Consolas,Menlo,'Courier New',monospace;
                            font-size:12px;
                            line-height:1.5;
                            white-space:pre-wrap;
                            word-wrap:break-word;
                            overflow-wrap:break-word;
                            border:0
                        "
                    >{{ error_message_html }}</pre>

                </td>

            </tr>

        </table>

    </td>

</tr>


<tr>

    <td
        colspan="2"
        bgcolor="#172b4d"
        style="
            background:#172b4d;
            background-color:#172b4d;
            border:0;
            padding:18px 32px;
            color:#9fb1c7;
            font-size:11px
        "
    >

        Rustic Backup Report · {{ hostname }}

        <span style="float:right">
            {{ rustic_version }}
        </span>

    </td>

</tr>

</table>
